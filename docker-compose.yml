services:
  dashboard:
    build: .
    image: industrial-monitor:0.1
    container_name: industrial-monitor
    ports:
      - "8080:5000"
    volumes:
      - alarms-data:/data
    environment:
      DB_PATH: /data/alarms.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  alarms-data:
    external: true
